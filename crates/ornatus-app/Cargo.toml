[package]
name = "ornatus-app"
description = "ornatus application: egui UI, desktop dev harness and wasm entry point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ornatus-core = { path = "../ornatus-core" }
ornatus-render = { path = "../ornatus-render" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
glam = "0.34"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wgpu = { version = "30", default-features = false, features = ["webgpu", "webgl"] }

[lints]
workspace = true
